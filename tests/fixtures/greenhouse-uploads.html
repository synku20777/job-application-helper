<!doctype html>
<html>
  <body>
    <form id="application-form">
      <label for="first_name">First Name</label>
      <input id="first_name" name="job_application[first_name]" />
      <label for="last_name">Last Name</label>
      <input id="last_name" name="job_application[last_name]" />
      <label for="resume">Resume</label>
      <input id="resume" type="file" name="job_application[resume]" />
      <label for="cover_letter">Cover Letter</label>
      <input id="cover_letter" type="file" name="job_application[cover_letter]" />
      <label for="linkedin">LinkedIn Profile</label>
      <input id="linkedin" name="job_application[answers_attributes][0][text_value]" />
      <label for="website">Website</label>
      <input id="website" name="job_application[answers_attributes][1][text_value]" />
    </form>
  </body>
</html>
