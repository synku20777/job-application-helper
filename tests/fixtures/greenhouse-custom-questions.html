<!doctype html>
<html>
  <body>
    <form id="application-form">
      <label for="first_name">First Name</label>
      <input id="first_name" name="job_application[first_name]" />
      <label for="email">Email</label>
      <input id="email" name="job_application[email]" />
      <div class="field question">
        <label for="question_1">Why do you want to work here?</label>
        <textarea id="question_1" name="job_application[answers_attributes][0][text_value]"></textarea>
      </div>
      <div class="field custom-field">
        <label for="custom_1">Preferred office location</label>
        <select id="custom_1" name="job_application[custom_fields][preferred_office]">
          <option>Riga</option>
          <option>Copenhagen</option>
        </select>
      </div>
    </form>
  </body>
</html>
